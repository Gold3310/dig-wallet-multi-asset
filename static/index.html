<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Multi-Asset Wallet Demo</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Wallet</p>
          <h1>Multi-Asset</h1>
        </div>
        <div class="status-pill">Demo</div>
      </header>

      <section class="card">
        <div class="card-header">
          <h2>Unlock</h2>
        </div>

        <label for="phrase">Recovery phrase</label>
        <textarea id="phrase" rows="4" placeholder="abandon abandon abandon…"></textarea>

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter password" />

        <button id="unlockBtn" class="primary-btn">Unlock wallet</button>
        <div id="unlockStatus" class="status" aria-live="polite"></div>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>Addresses</h2>
        </div>
        <div id="addressList" class="address-list"></div>
      </section>

      <section class="card">
        <div class="card-header">
          <h2>Derive & Sign</h2>
        </div>

        <label for="assetSelect">Asset</label>
        <select id="assetSelect">
          <option value="chia">Chia</option>
          <option value="ethereum">Ethereum</option>
          <option value="bitcoin">Bitcoin</option>
        </select>

        <label for="addressInput">Paste address</label>
        <input id="addressInput" type="text" placeholder="Paste address here" />

        <div class="button-row">
          <button id="deriveBtn" class="primary-btn">Generate key</button>
        </div>

        <label for="messageInput">Message</label>
        <textarea id="messageInput" rows="2" placeholder="Enter message to sign"></textarea>

        <div class="button-row">
          <button id="signBtn" class="secondary-btn">Sign message</button>
        </div>

        <div id="deriveStatus" class="status" aria-live="polite"></div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
